name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e .[dev]

      - name: Run tests
        run: |
          pytest -q

  # Editable installs (-e) never exercise wheel packaging, so a broken wheel
  # can pass tests and still fail every real `pip install` from source.
  # This job builds the actual wheel and installs it into a clean venv.
  wheel-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify wheel has no duplicate entries and ships data files
        run: |
          python - <<'PY'
          import glob, zipfile, collections
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          dupes = [n for n, c in collections.Counter(names).items() if c > 1]
          assert not dupes, f"duplicate entries in wheel: {dupes}"
          assert "agent_reach/skill/SKILL.md" in names, "SKILL.md missing from wheel"
          required_execution_files = (
              "agent_reach/execution/v1/contracts.py",
              "agent_reach/execution/v1/registry.py",
              "agent_reach/execution/v1/youtube.py",
              "agent_reach/execution/v1/v2ex.py",
              "agent_reach/execution/v1/_v2ex_transport.py",
              "agent_reach/execution/v1/exa.py",
              "agent_reach/execution/v1/opencli_social.py",
              "agent_reach/execution/v1/_opencli_no_lifecycle.mjs",
              "agent_reach/execution/v1/xueqiu.py",
          )
          for name in required_execution_files:
              assert name in names, f"{name} missing from wheel"
          assert "agent_reach/execution/v1/linkedin.py" not in names
          for prefix in ("agent_reach/guides/", "agent_reach/scripts/", "agent_reach/skill/references/"):
              assert any(n.startswith(prefix) for n in names), f"{prefix} missing from wheel"
          print(f"wheel OK: {len(names)} entries, no duplicates, data files present")
          PY

      - name: Smoke-install wheel and closed execution runtimes into clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet \
            "yt-dlp==2026.7.4" \
            "yt-dlp-ejs==0.8.0" \
            "deno==2.8.3" \
            dist/*.whl
          /tmp/smoke/bin/agent-reach version
          cd /tmp
          /tmp/smoke/bin/python - <<'PY'
          import hashlib
          import importlib.util
          import os
          import socket
          import sys
          from importlib.metadata import version
          from importlib.resources import files
          from inspect import signature
          from pathlib import Path
          from types import SimpleNamespace

          import agent_reach
          import agent_reach.execution.v1 as execution_v1
          from agent_reach.execution.v1 import (
              MCPORTER_ARTIFACTS_CAPABILITY,
              NETWORK_ACCESS_CAPABILITY,
              OPENCLI_SESSION_CAPABILITY,
              PRIVATE_WORKSPACE_CAPABILITY,
              PROTOCOL_VERSION,
              XUEQIU_SESSION_CAPABILITY,
              ExecutionContextV1,
              ExecutionLimitsV1,
              ExecutionRequestV1,
              ExecutionSuccessV1,
              McporterArtifactsV1,
              NetworkAccessV1,
              OpenCliSessionV1,
              PrivateWorkspaceV1,
              XueqiuSessionV1,
              execute,
              list_capabilities,
          )

          assert (files("agent_reach") / "skill" / "SKILL.md").is_file()
          runtime_modules = {
              "agent_reach.execution.v1.youtube",
              "agent_reach.execution.v1.v2ex",
              "agent_reach.execution.v1._v2ex_transport",
              "agent_reach.execution.v1.exa",
              "agent_reach.execution.v1.opencli_social",
              "agent_reach.execution.v1.xueqiu",
          }
          assert runtime_modules.isdisjoint(sys.modules)
          assert "deno" not in sys.modules
          assert {
              "MCPORTER_ARTIFACTS_CAPABILITY",
              "OPENCLI_SESSION_CAPABILITY",
              "PRIVATE_WORKSPACE_CAPABILITY",
              "XUEQIU_SESSION_CAPABILITY",
              "McporterArtifactsV1",
              "OpenCliSessionV1",
              "PrivateWorkspaceV1",
              "XueqiuSessionV1",
          } <= set(execution_v1.__all__)
          assert "LINKEDIN_MCP_CAPABILITY" not in execution_v1.__all__
          assert "LinkedInMcpV1" not in execution_v1.__all__
          assert not hasattr(execution_v1, "LINKEDIN_MCP_CAPABILITY")
          assert not hasattr(execution_v1, "LinkedInMcpV1")
          assert importlib.util.find_spec("agent_reach.execution.v1.linkedin") is None
          assert execution_v1.McporterArtifactsV1 is McporterArtifactsV1
          assert execution_v1.OpenCliSessionV1 is OpenCliSessionV1
          assert execution_v1.PrivateWorkspaceV1 is PrivateWorkspaceV1
          assert execution_v1.XueqiuSessionV1 is XueqiuSessionV1

          def loaded_backend_modules():
              return tuple(
                  name
                  for name in sys.modules
                  if name in {"yt_dlp", "yt_dlp_ejs"}
                  or name.startswith(("yt_dlp.", "yt_dlp_ejs."))
                  or name == "httpcore"
                  or name.startswith("httpcore.")
              )

          assert loaded_backend_modules() == ()
          capabilities = list_capabilities()
          assert tuple((item.source, item.operation) for item in capabilities) == (
              ("rss", "read.feed"),
              ("rss", "browse.entries"),
              ("bilibili", "search.videos"),
              ("bilibili", "read.video"),
              ("bilibili", "browse.hot"),
              ("bilibili", "browse.rank"),
              ("youtube", "read.video"),
              ("youtube", "search.videos"),
              ("youtube", "read.subtitles"),
              ("v2ex", "browse.hot"),
              ("v2ex", "browse.node_topics"),
              ("v2ex", "read.topic"),
              ("v2ex", "read.user"),
              ("exa", "search.web"),
              ("reddit", "search.posts"),
              ("reddit", "read.post"),
              ("reddit", "browse.subreddit"),
              ("reddit", "browse.hot"),
              ("reddit", "browse.popular"),
              ("reddit", "browse.all"),
              ("reddit", "read.subreddit"),
              ("facebook", "search"),
              ("facebook", "read.profile"),
              ("facebook", "browse.feed"),
              ("facebook", "browse.groups"),
              ("instagram", "search.users"),
              ("instagram", "read.profile"),
              ("instagram", "browse.user_posts"),
              ("instagram", "browse.explore"),
              ("twitter", "search.posts"),
              ("xiaohongshu", "search.notes"),
              ("xueqiu", "search.stocks"),
              ("exa", "search.code"),
          )
          expected_new_capabilities = {
              ("youtube", "search.videos"): (
                  "youtube.search.videos.arguments.v1",
                  ("youtube.video.v1",),
                  "yt-dlp",
                  "2026.7.4",
                  (NETWORK_ACCESS_CAPABILITY,),
                  50,
              ),
              ("youtube", "read.subtitles"): (
                  "youtube.read.subtitles.arguments.v1",
                  ("youtube.subtitle.v1",),
                  "yt-dlp",
                  "2026.7.4",
                  (NETWORK_ACCESS_CAPABILITY, PRIVATE_WORKSPACE_CAPABILITY),
                  1,
              ),
              ("v2ex", "browse.hot"): (
                  "v2ex.browse.hot.arguments.v1",
                  ("v2ex.topic.v1",),
                  "v2ex-public-api",
                  "legacy-json-2026-07-31",
                  (NETWORK_ACCESS_CAPABILITY,),
                  50,
              ),
              ("v2ex", "browse.node_topics"): (
                  "v2ex.browse.node_topics.arguments.v1",
                  ("v2ex.topic.v1",),
                  "v2ex-public-api",
                  "legacy-json-2026-07-31",
                  (NETWORK_ACCESS_CAPABILITY,),
                  50,
              ),
              ("v2ex", "read.topic"): (
                  "v2ex.read.topic.arguments.v1",
                  ("v2ex.topic.v1", "v2ex.reply.v1"),
                  "v2ex-public-api",
                  "legacy-json-2026-07-31",
                  (NETWORK_ACCESS_CAPABILITY,),
                  21,
              ),
              ("v2ex", "read.user"): (
                  "v2ex.read.user.arguments.v1",
                  ("v2ex.profile.v1",),
                  "v2ex-public-api",
                  "legacy-json-2026-07-31",
                  (NETWORK_ACCESS_CAPABILITY,),
                  1,
              ),
              ("exa", "search.web"): (
                  "exa.search.web.arguments.v1",
                  ("exa.search.result.v1",),
                  "exa-mcporter",
                  "0.12.3+exa-web.v1",
                  (NETWORK_ACCESS_CAPABILITY, MCPORTER_ARTIFACTS_CAPABILITY),
                  20,
              ),
              ("xueqiu", "search.stocks"): (
                  "xueqiu.search.stocks.arguments.v1",
                  ("xueqiu.stock.v1",),
                  "xueqiu-api",
                  "1.5.0+search.v1",
                  (XUEQIU_SESSION_CAPABILITY,),
                  50,
              ),
              ("exa", "search.code"): (
                  "exa.search.code.arguments.v1",
                  ("exa.code.result.v1",),
                  "exa-mcporter",
                  "0.12.3+exa-code.v1",
                  (NETWORK_ACCESS_CAPABILITY, MCPORTER_ARTIFACTS_CAPABILITY),
                  20,
              ),
          }
          expected_new_capabilities.update(
              {
                  (source, operation): (
                      f"{source}.{operation}.arguments.v1",
                      (schema,),
                      "opencli",
                      "1.8.6-hermes.1",
                      (OPENCLI_SESSION_CAPABILITY,),
                      maximum_items,
                  )
                  for source, operation, schema, maximum_items in (
                      ("reddit", "search.posts", "reddit.post.v1", 50),
                      ("reddit", "read.post", "reddit.thread.item.v1", 14),
                      ("reddit", "browse.subreddit", "reddit.post.v1", 50),
                      ("reddit", "browse.hot", "reddit.post.v1", 50),
                      ("reddit", "browse.popular", "reddit.post.v1", 50),
                      ("reddit", "browse.all", "reddit.post.v1", 50),
                      ("reddit", "read.subreddit", "reddit.subreddit.v1", 1),
                      ("facebook", "search", "facebook.search.result.v1", 50),
                      ("facebook", "read.profile", "facebook.profile.v1", 1),
                      ("facebook", "browse.feed", "facebook.post.v1", 50),
                      ("facebook", "browse.groups", "facebook.group.v1", 50),
                      ("instagram", "search.users", "instagram.user.v1", 50),
                      ("instagram", "read.profile", "instagram.profile.v1", 1),
                      ("instagram", "browse.user_posts", "instagram.post.v1", 50),
                      ("instagram", "browse.explore", "instagram.post.v1", 50),
                      ("twitter", "search.posts", "twitter.post.v1", 50),
                      ("xiaohongshu", "search.notes", "xiaohongshu.note.v1", 50),
                  )
              }
          )
          capability_by_operation = {
              (item.source, item.operation): item for item in capabilities
          }
          for operation, expected in expected_new_capabilities.items():
              item = capability_by_operation[operation]
              assert (
                  item.argument_schema_id,
                  item.result_schema_ids,
                  item.backend_id,
                  item.backend_version,
                  item.required_host_capabilities,
                  item.maximum_items,
              ) == expected
          assert runtime_modules.isdisjoint(sys.modules)
          assert loaded_backend_modules() == ()

          import agent_reach.execution.v1._v2ex_transport as v2ex_transport
          import agent_reach.execution.v1.exa as exa_execution
          import agent_reach.execution.v1.opencli_social as opencli_execution
          import agent_reach.execution.v1.v2ex as v2ex_execution
          import agent_reach.execution.v1.xueqiu as xueqiu_execution
          import agent_reach.execution.v1.youtube as youtube_execution

          package_file = Path(agent_reach.__file__).resolve()
          assert package_file.is_relative_to(Path(sys.prefix).resolve())
          expected_runtime_files = {
              youtube_execution: "youtube.py",
              v2ex_execution: "v2ex.py",
              v2ex_transport: "_v2ex_transport.py",
              exa_execution: "exa.py",
              opencli_execution: "opencli_social.py",
              xueqiu_execution: "xueqiu.py",
          }
          for module, name in expected_runtime_files.items():
              assert Path(module.__file__).resolve() == package_file.parent / "execution" / "v1" / name
          opencli_guard = Path(opencli_execution.__file__).with_name(
              "_opencli_no_lifecycle.mjs"
          )
          reviewed_opencli_guard_sha256 = (
              "9c9cd9bf8163fb3fba863f94a71e9ea09ea3323b84f89a06b55e3d1f19515213"
          )
          assert opencli_execution._LIFECYCLE_GUARD_SHA256 == reviewed_opencli_guard_sha256
          assert hashlib.sha256(opencli_guard.read_bytes()).hexdigest() == (
              reviewed_opencli_guard_sha256
          )
          assert opencli_execution._OPENCLI_OFFICIAL_BASE_COMMIT == (
              "399c0de2a76eb979aee3a3836cf2d24fd247780f"
          )
          assert opencli_execution._OPENCLI_SOURCE_COMMIT == (
              "594b21498680f6372279f178aa9b3aaed2c71e35"
          )
          assert opencli_execution._OPENCLI_SOURCE_TREE == (
              "be64296855727d00478cc857f2b26eb7d3790057"
          )
          assert opencli_execution._OPENCLI_TARBALL_SHA256 == (
              "dac98c69802621d55d8e3a5ae7032f47ab22b3785331a69499a907456f9dfb73"
          )
          assert opencli_execution._OPENCLI_TARBALL_SHA512 == (
              "kiYpXZ4jrwr6q6yVHCclL0wv3alO0JN1+GOjeY9S9q+73EKkZ3ZQE0nIiE7WoK5MC1ttK918PkOhYO3uKQPgyQ=="
          )
          expected_signature = (
              "(request: 'ExecutionRequestV1', context: 'ExecutionContextV1') "
              "-> 'ExecutionResultV1'"
          )
          for function, module_name in (
              (youtube_execution.execute_youtube, "agent_reach.execution.v1.youtube"),
              (v2ex_execution.execute_v2ex, "agent_reach.execution.v1.v2ex"),
              (exa_execution.execute_exa, "agent_reach.execution.v1.exa"),
              (
                  opencli_execution.execute_opencli_social,
                  "agent_reach.execution.v1.opencli_social",
              ),
              (xueqiu_execution.execute_xueqiu, "agent_reach.execution.v1.xueqiu"),
          ):
              assert function.__module__ == module_name
              assert str(signature(function)) == expected_signature
          assert loaded_backend_modules() == ()

          expected_versions = {
              "yt-dlp": "2026.7.4",
              "yt-dlp-ejs": "0.8.0",
              "deno": "2.8.3",
          }
          assert {name: version(name) for name in expected_versions} == expected_versions
          deno = Path(sys.executable).parent / "deno"

          plugin_dirs = SimpleNamespace(value=["ambient"])

          class FakeYoutubeDL:
              instances = []

              def __init__(self, params):
                  self.params = params
                  self.calls = []
                  self.closed = False
                  self.instances.append(self)

              def extract_info(self, target, *, download, ie_key):
                  self.calls.append((target, download, ie_key))
                  return {
                      "id": "dQw4w9WgXcQ",
                      "title": " Video   title ",
                      "description": " Description\nbody ",
                      "uploader": " Channel\tname ",
                      "duration": 213,
                      "view_count": 42,
                      "comment_count": 7,
                      "upload_date": "20091025",
                  }

              def close(self):
                  self.closed = True

          def fake_import_module(name):
              if name == "yt_dlp":
                  return SimpleNamespace(YoutubeDL=FakeYoutubeDL)
              if name == "yt_dlp_ejs":
                  return SimpleNamespace(version="0.8.0")
              if name == "yt_dlp.globals":
                  return SimpleNamespace(plugin_dirs=plugin_dirs)
              raise AssertionError(f"unexpected backend import: {name}")

          def deny_network(*_args, **_kwargs):
              raise AssertionError("installed-wheel smoke attempted network access")

          youtube_execution.import_module = fake_import_module
          socket.socket = deny_network
          socket.create_connection = deny_network

          video_url = "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
          result = execute(
              ExecutionRequestV1(
                  PROTOCOL_VERSION,
                  "youtube",
                  "read.video",
                  {"url": video_url},
              ),
              ExecutionContextV1(
                  (NetworkAccessV1(),),
                  limits=ExecutionLimitsV1(
                      maximum_items=1,
                      maximum_text_characters=16_000,
                  ),
              ),
          )

          assert isinstance(result, ExecutionSuccessV1)
          assert len(result.items) == 1
          assert result.items[0].schema_id == "youtube.video.v1"
          assert result.items[0].fields == {
              "text": "Description body",
              "native_id": "dQw4w9WgXcQ",
              "title": "Video title",
              "url": video_url,
              "author": "Channel name",
              "published_at": "2009-10-25",
              "duration_seconds": 213,
              "view_count": 42,
              "comment_count": 7,
          }
          assert len(FakeYoutubeDL.instances) == 1
          downloader = FakeYoutubeDL.instances[0]
          assert downloader.calls == [(video_url, False, "Youtube")]
          assert downloader.closed is True
          assert downloader.params["js_runtimes"] == {"deno": {"path": str(deno)}}
          assert downloader.params["proxy"] == ""
          assert downloader.params["cookiefile"] is None
          assert downloader.params["cookiesfrombrowser"] is None
          assert downloader.params["usenetrc"] is False
          assert downloader.params["remote_components"] == []
          assert plugin_dirs.value == []
          assert os.environ["YTDLP_NO_PLUGINS"] == "1"
          linkedin_failure = execute(
              ExecutionRequestV1(
                  PROTOCOL_VERSION,
                  "linkedin",
                  "search.people",
                  {"query": "closed", "limit": 1},
              ),
              ExecutionContextV1(),
          )
          assert linkedin_failure.error_code == "unsupported_source"
          print("installed wheel exposes 33 descriptors and no LinkedIn execution runtime OK")
          PY
